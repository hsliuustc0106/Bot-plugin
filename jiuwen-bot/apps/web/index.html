<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jiuwen Bot</title><link rel="stylesheet" href="/style.css"></head>
<body><aside><h1>Jiuwen Bot</h1><p>Private chats &amp; a small team</p><nav id="conversations" aria-label="Conversations"></nav><button id="new-bot">Create a bot</button><p class="hint">Team turns: Chief → Worker → Chief. Each conversation has its own history.</p></aside>
<main><header><h2 id="title">Connecting…</h2><label>Read-note permission <select id="permission"><option value="ask">Ask each time</option><option value="deny">Deny</option><option value="allow">Allow</option></select></label></header><p id="error" role="alert"></p><section id="messages" aria-label="Chat messages"></section><section id="approvals" aria-label="Questions and approvals"></section><form id="compose"><label for="message">Message</label><textarea id="message" required maxlength="20000" placeholder="Send a task to your bot"></textarea><div><button type="submit">Send</button><button type="button" id="stop">Stop current exchange</button><span id="connection" role="status"></span></div></form></main><script type="module" src="/app.js"></script></body></html>
